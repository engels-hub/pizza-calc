# TrueNAS SCALE: Apps > Discover Apps > Custom App > "Install via YAML",
# paste this file.
#
# Cloudflare: Zero Trust > Networks > Tunnels > your existing tunnel >
# Published application routes > add:
#   Hostname: pizza.apapss.id.lv
#   Service:  HTTP  <truenas-ip>:3000
#
# If host port 3000 is already taken on the NAS, change the LEFT number below
# (e.g. "3080:3000") and use that port in the route instead.

services:
  pizza:
    image: ghcr.io/engels-hub/pizza-calc:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Riga
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
