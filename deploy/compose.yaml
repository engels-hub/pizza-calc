# TrueNAS SCALE: Apps > Discover Apps > Custom App > "Install via YAML",
# paste this file, and replace the token below with your tunnel's token
# (Cloudflare Zero Trust > Networks > Tunnels > your tunnel > Docker).
#
# In the tunnel's Public Hostname settings, point your hostname at:
#   Service: HTTP   URL: pizza:3000
#
# No ports are published: the site is only reachable through the tunnel.

services:
  pizza:
    image: ghcr.io/engels-hub/pizza-calc:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      TZ: Europe/Riga
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "paste-your-tunnel-token-here"
    depends_on:
      pizza:
        condition: service_healthy
